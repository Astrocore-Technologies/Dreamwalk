  # Keep the former required check's exact name. Explicit shard jobs let this
  # gate inspect every result, rather than trusting one matrix aggregate result.
  platform:
    name: platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [static, integration, browser_1, browser_2, browser_3]
    steps:
      - name: Require every check and browser shard to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const expected = ['static', 'integration', 'browser_1', 'browser_2', 'browser_3'];
          const results = JSON.parse(process.env.REQUIRED_RESULTS);
          if (Object.keys(results).length !== expected.length ||
              expected.some((name) => results[name]?.result !== 'success')) {
            console.error('Required checks did not all succeed:',
              Object.fromEntries(expected.map((name) => [name, results[name]?.result ?? 'missing'])));
            process.exit(1);
          }
          console.log('All static, integration and browser shard checks passed.');
          NODE
