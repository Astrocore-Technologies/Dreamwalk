name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Do not repeat the full suite for both a feature push and its PR. A newer
# revision cancels only its own PR/ref; unrelated branches keep their checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NODE_ENV: test
  WEB_ORIGIN: http://localhost:3000
  AI_PROVIDER: mock
  NPC_AI_PROVIDER: mock
  NPC_AI_EXTERNAL_APPROVED: 'false'
  PAID_GENERATION_ENABLED: 'false'
  PAYMENTS_ENABLED: 'false'
  DISCORD_ENABLED: 'false'
  DEV_AUTH_ENABLED: 'false'
  DEMO_FAUCET_ENABLED: 'false'
jobs:
  static:
    name: Static checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      # The full build above already compiles contracts/game-core. This is the
      # final command of the root typecheck script, with all workspace checks.
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint
      - run: npm run test:unit
      - name: Game rules, UI projection and autosave controller tests
        run: npm run test:game
      - name: Private authoring, provisional legal copy and Sparks UI contracts
        run: node --import tsx --test tests/game/private-authoring-privacy.test.mjs tests/game/story-builder-authoring.test.mjs tests/game/story-npc-editor.test.mjs tests/game/closed-test-legal.test.mjs tests/game/sparks-receipts-ui.test.mjs tests/game/map-camera.test.mjs tests/game/map-actions-harness.test.mjs tests/game/renderer-activity.test.mjs
      - name: Map-shaped image quotes and reviewed range policy (synthetic transports)
        run: node --test tests/game/image-framing.test.cjs tests/game/story-map-intent.test.cjs tests/game/manifest-framing.test.cjs
      - name: Deterministic NPC behavior rubric and bounded local benchmark
        run: npm run test:npc:eval
      - name: Authored character quality and safe provider presentation (zero external calls)
        run: node scripts/evaluate-character-quality.mjs && node --test tests/game/character-provider.test.cjs tests/game/character-authoring.test.cjs && node --import tsx --test tests/game/npc-character-ui.test.mjs
      - name: Semantic NPC context and disclosure regression
        run: node --test tests/game/npc-semantic-context.test.cjs tests/game/npc-reply-binding.test.cjs tests/game/world-items-provider.test.cjs tests/game/coauthor-provider.test.cjs tests/game/authoring-provider.test.cjs tests/game/live-secret-loader.test.mjs
      - name: Automatic translation cache and output safeguards (synthetic only)
        run: |
          node --test tests/game/automatic-translation.test.cjs tests/game/content-translation-fields.test.cjs tests/game/released-playable-translation.test.cjs tests/game/presentation-alias-admission.test.cjs
          node --import tsx --test tests/game/studio-content-translation.test.mjs
      - name: Safe image provider error diagnostics
        run: node --test tests/images/provider-error-diagnostics.test.mjs
      # Exact test payload of test:voice; the same-job production build supplies
      # contracts, game-core and API output. No cross-commit build cache is used.
      - name: Manual-provider and world-progress safeguards (zero external calls)
        run: node --test tests/game/voice-*.test.cjs

  integration:
    name: Isolated PostgreSQL integrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The world-item suite includes its complete map/inventory browser journey.
      # Use the same Playwright-managed Chromium installed by the browser shards.
      - name: World-item browser dependencies
        run: npx playwright install --with-deps chromium
      # This wrapper builds all three server workspaces before starting its
      # disposable cluster. Keep its serial tests: they share runtime resources.
      - name: Game runtime and isolated PostgreSQL integration
        run: npm run test:game:integration
      - name: Private release and opt-in Sparks accounting (disposable databases)
        run: node --test tests/game/paid-start.integration.test.cjs tests/game/private-release.integration.test.cjs tests/game/admin-story-deletion.integration.test.cjs tests/game/story-local-npcs.test.cjs tests/game/sparks-accounting.test.cjs tests/game/sparks-dispatch.integration.test.cjs tests/game/npc-sparks.integration.test.cjs
      - name: Durable translation cache and erasure (disposable database)
        run: node --test --test-concurrency=1 tests/game/automatic-translation.integration.test.cjs tests/game/platform-metadata.integration.test.cjs tests/game/platform-content.integration.test.cjs tests/game/released-playable-translation.integration.test.cjs tests/game/presentation-alias-admission.integration.test.cjs
      - name: Private authoring HTTP persistence journey (synthetic only)
        run: STORY_AUTHORING_HTTP=1 node scripts/test-story-authoring.mjs
      - name: Private authoring browser journey (synthetic only)
        run: node scripts/test-story-authoring.mjs
      - name: Save synthetic authoring browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-authoring-browser-evidence
          path: test-results/story-authoring/
          if-no-files-found: ignore
      - name: Durable isolated evaluation ledger and crash recovery
        run: node scripts/test-live-story-pg.mjs
      - name: Zero-network story evaluation rehearsal
        run: node scripts/evaluate-live-story.mjs --rehearse
      # Use only existing skip-build switches, after a successful same-job build.
      # The wrappers still own mock gates, migrations, seeding, tests and cleanup.
      - name: Live API integration tests
        run: npm run test:integration -- --skip-build
      - name: Reusable asset ACL and immutable publication integration
        run: npm run test:assets:integration
      - name: Image quote, consent, budget and admission integration
        run: npm run test:images:integration -- --skip-build
      - name: Visual and spatial authoring integration (synthetic transports only)
        run: npm run test:visuals:integration -- --skip-build
      - name: Public discovery snapshot isolation
        run: npm run test:home:integration
      # Exact test payload of test:mail, after the same-job server build.
      - name: Local SMTP capture integration
        run: node --test tests/mail-integration.test.mjs tests/google-auth.test.mjs tests/mail-brevo.test.mjs

  browser_1:
    name: Browser shard 1 of 3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each shard has a separate runner, database, application and asset directory.
    # Keep one worker; multi-player WebGL journeys already use several contexts.
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: dreamwalk
          POSTGRES_DB: dreamwalk_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-browser-1-ephemeral
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U dreamwalk -d dreamwalk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dreamwalk:${{ github.run_id }}-${{ github.run_attempt }}-browser-1-ephemeral@127.0.0.1:55432/dreamwalk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests (shard 1 of 3)
        env:
          ASSET_DIR: ${{ runner.temp }}/dreamwalk-browser-1-assets
        run: |
          # Compile this exact checkout once, rather than compiling each route
          # during browser journeys. API mock gates and shard isolation stay intact.
          NODE_ENV=production npm run build:web
          setsid env NODE_ENV=development npm run dev -- --prebuilt-web > "$RUNNER_TEMP/dreamwalk-web.log" 2>&1 &
          APP_PID=$!
          trap 'kill -- "-$APP_PID" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Application exited before becoming ready" >&2
              exit 1
            fi
            if curl --max-time 2 -sf http://127.0.0.1:3000/ > /dev/null && \
               curl --max-time 2 -sf http://127.0.0.1:4000/api/v1/auth/me > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Application did not become ready" >&2
            exit 1
          fi
          node scripts/browser-shard.mjs 1/3
      # Retain the initial failure trace even if its one configured retry succeeds.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-test-evidence-shard-1
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/dreamwalk-web.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Save actual reusable-art canvas preview
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reusable-art-preview-shard-1
          path: test-results/**/custom-art-scene.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save actual homepage desktop and mobile previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-preview-shard-1
          path: test-results/**/home-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save actual complete-adventure scene previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-adventure-preview-shard-1
          path: test-results/**/sample-adventure-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save actual evolving-story and media previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narrative-director-preview-shard-1
          path: test-results/**/director-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save actual unified story desktop and mobile previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-story-preview-shard-1
          path: test-results/**/unified-story-*.png
          if-no-files-found: ignore
          retention-days: 7

